}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --text: #ff2a2a; --line: #ffd400; }
  body { background-image: none; }
}
main { max-width: 42rem; margin: 0 auto; padding: 1.5rem 16px 3rem; }
.box { border: 2px solid var(--line); padding: 1rem 1.25rem; margin: 1rem 0; }

h1 { font-size: 1.1rem; border-bottom: 2px solid var(--line); padding-bottom: .4rem; }
input[type=text], textarea { width: 100%; box-sizing: border-box; font: inherit; padding: .4rem;
  border: 2px solid var(--line); background: transparent; color: var(--text); }
textarea { min-height: 5rem; resize: vertical; }
button { font: inherit; color: var(--text); background: transparent; border: 2px solid var(--line);
  padding: .3rem .8rem; margin-top: .5rem; cursor: pointer; }
.file { border-top: 1px solid var(--line); padding: .6rem 0; }
.file:first-child { border-top: 0; }
.file img, .file video { max-width: 100%; display: block; margin: .5rem 0; border: 1px solid var(--line); }
.file audio { width: 100%; margin: .5rem 0; }
.note { font-size: .9rem; opacity: .85; }
h2 { font-size: 1rem; margin: 0 0 .5rem; }

<body>
<main>
<h1>A message sent with rmail</h1>
<noscript><div class="box">This message is locked, and the small program on this page that unlocks it needs
JavaScript.  Turn JavaScript on for this page, or open the link in another browser.  Nothing on this page
is loaded from anywhere else.</div></noscript>

<form id="ask" class="box" hidden>
  <label for="code">This message is locked.  Type the code you were given (words joined by dashes), or paste
  the whole link:</label>
  <input id="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
  <button type="submit">Unlock</button>
</form>
<p id="status" class="note"></p>
<div id="message" class="box" hidden><div id="body"></div></div>
<div id="files" class="box" hidden></div>
<div id="talk" class="box" hidden>
  <h2>Replies</h2>
  <div id="entries"></div>
  <form id="say" hidden>
    <label for="who">Your name (optional, shown to everyone who has the link):</label>
    <input id="who" type="text" maxlength="40" autocomplete="off">
    <label for="words">A note to the sender:</label>
    <textarea id="words" maxlength="8192"></textarea>
    <button type="submit">Send</button>
    <p id="sent" class="note"></p>
  </form>
</div>
<p class="note">The code after <code>#</code> in the link is the key: your browser keeps it and never sends
it.  Notes left here are locked with it too, and anyone who has the link can read them.  This page can be saved and opened from your own disk next time, with the whole link pasted in.</p>

  function utf8(s) { return new TextEncoder().encode(s); }
  function hex(bytes) {
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += (bytes[i] < 16 ? "0" : "") + bytes[i].toString(16);
    return s;
  }
  function normalize(words) {
    return words.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-+|-+$/g, "");
  }
  function derive(words) {
    var w = normalize(words);
    return { words: w, address: hex(sha256(utf8("rmail public link address\0" + w))),
             key: sha256(utf8("rmail public link key\0" + w)),
             noteKey: sha256(utf8("rmail public link note\0" + w)) };
  }

  // a typed code, or a whole link: the server it names and the words
  function readInput(text, here) {
    text = (text || "").trim();
    var hash = text.indexOf("#");
    if (hash >= 0) {
      // only the server is kept from a link: the page and the sealed
      // answers are all at its root
      var server = /^(https?:\/\/[^\/?#]+)/i.exec(text.slice(0, hash));
      return { base: server ? server[1] : here, words: text.slice(hash + 1) };
    }
    return { base: here, words: text };
  }

  // A piece is "rmail piece <file> <piece> <size> <mtime>\n" then bytes.
  function pieceBytes(plain, file, piece, size, mtime) {
    var nl = plain.indexOf(10);
    if (nl < 0 || nl > 80) return null;
    var head = new TextDecoder().decode(plain.subarray(0, nl));
    if (head !== "rmail piece " + file + " " + piece + " " + size + " " + mtime) return null;
    return plain.subarray(nl + 1);
  }

  // a reader's note, sealed for the server: {v, name, body}
  function sealNote(noteKey, nonce, name, body) {
    return seal(noteKey, nonce, utf8(JSON.stringify({ v: 1, name: name, body: body })));
  }

  return { sha256: sha256, open: open, seal: seal, sealNote: sealNote, derive: derive,
           normalize: normalize, readInput: readInput, pieceBytes: pieceBytes, hex: hex };
})();

if (typeof module !== "undefined") module.exports = RmailLink;

if (typeof document !== "undefined") (function () {
  var L = RmailLink, $ = function (id) { return document.getElementById(id); };
  var here = /^https?:$/.test(location.protocol) ? location.origin : null;
  var link = null, message = null, db = null;

  function status(text) { $("status").textContent = text; }

  function openDb() {
    return new Promise(function (resolve) {
      if (!window.indexedDB) return resolve(null);
      var req = indexedDB.open("rmail-public-link", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("pieces"); };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { resolve(null); };
    });
  }
  function dbGet(key) {
    return new Promise(function (resolve) {
      if (!db) return resolve(null);
      var r = db.transaction("pieces").objectStore("pieces").get(key);
      r.onsuccess = function () { resolve(r.result || null); };
      r.onerror = function () { resolve(null); };
    });
  }
  function dbPut(key, bytes) {
    return new Promise(function (resolve) {
      if (!db) return resolve();
      var t = db.transaction("pieces", "readwrite");
      t.objectStore("pieces").put(bytes, key);
      t.oncomplete = t.onerror = function () { resolve(); };
    });
  }
  function dbDrop(prefix, count) {
    if (!db) return;
    var store = db.transaction("pieces", "readwrite").objectStore("pieces");
    for (var p = 0; p < count; p++) store.delete(prefix + p);
  }

  function fetchSealed(path) {
    return fetch(link.base + path, { cache: "no-store", referrerPolicy: "no-referrer" })
      .then(function (r) {
        if (r.status === 404) throw new Error("gone");
        if (!r.ok) throw new Error("the server answered " + r.status);
        return r.arrayBuffer();
      }).then(function (b) { return new Uint8Array(b); });
  }

  var KINDS = { jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif",
    webp: "image/webp", svg: "image/svg+xml", mp4: "video/mp4", webm: "video/webm",
    ogv: "video/ogg", mov: "video/quicktime", mp3: "audio/mpeg", ogg: "audio/ogg",
    oga: "audio/ogg", wav: "audio/wav", flac: "audio/flac", m4a: "audio/mp4",
    pdf: "application/pdf", txt: "text/plain" };
  function kindOf(name) {
    var ext = (name.split(".").pop() || "").toLowerCase();
    return KINDS[ext] || "application/octet-stream";
  }

  // every piece of file i, from storage or the server, checked; then joined
  function getFile(i, f, progress) {
    var prefix = link.address + "/" + i + "/" + f.size + "/" + f.mtime + "/";
    var parts = [], p = 0;
    function next() {
      if (p >= f.pieces) return Promise.resolve(new Blob(parts, { type: kindOf(f.name) }));
      var at = p;
      return dbGet(prefix + at).then(function (have) {
        if (have) return have;
        return fetchSealed("/m/" + link.address + "/" + i + "/" + at).then(function (sealed) {
          var plain = L.open(link.key, sealed);
          var bytes = plain && L.pieceBytes(plain, i, at, f.size, f.mtime);
          if (!bytes) throw new Error("a piece did not check out; it may have been changed on the way");
          return dbPut(prefix + at, bytes).then(function () { return bytes; });
        });
      }).then(function (bytes) {
        parts.push(bytes); p++; progress(p, f.pieces); return next();
      });
    }
    return next().then(function (blob) {
      if (blob.size !== f.size) throw new Error("the file did not add up to its size");
      dbDrop(prefix, f.pieces);
      return blob;
    });
  }

  // the files of one part (0 the message, n the n-th answer) into box;
  // i is a file's place in the whole list, which is how its pieces are asked for
  function showFiles(box, part) {
    box.textContent = "";
    var count = 0;
    (message.files || []).forEach(function (f, n) {
      if ((f.part || 0) !== part) return;
      count++;
      var i = n + 1, row = document.createElement("div"); row.className = "file";
      var title = document.createElement("div"); title.textContent = f.name;
      row.appendChild(title);
      var note = document.createElement("div"); note.className = "note"; row.appendChild(note);
      if (f.missing) { note.textContent = "Not available: " + f.missing + "."; box.appendChild(row); return; }
      note.textContent = Math.max(1, Math.round(f.size / 1024)) + " KB";
      var kind = kindOf(f.name), media = /^(image|video|audio)\//.test(kind);
      var button = document.createElement("button"); button.type = "button";
      button.textContent = media ? "Show and save" : "Save";
      row.appendChild(button);
      function fetchIt() {
        button.disabled = true;
        getFile(i, f, function (got, all) { note.textContent = "piece " + got + " of " + all; })
          .then(function (blob) {
            var url = URL.createObjectURL(blob);
            if (media) {
              var el = document.createElement(kind.split("/")[0] === "image" ? "img" : kind.split("/")[0]);
              el.src = url; if (el.tagName !== "IMG") el.controls = true; el.alt = f.name;
              row.insertBefore(el, button);
            }
            var a = document.createElement("a"); a.href = url; a.download = f.name;
            a.textContent = "download this file"; note.textContent = "";
            note.appendChild(a);
            if (kind === "application/pdf") { a.removeAttribute("download"); a.target = "_blank"; a.textContent = "open in a new tab"; }
            button.remove();
          }).catch(function (e) {
            button.disabled = false; button.textContent = "Try again";
            note.textContent = e.message === "gone" ? "No longer offered." : e.message + " (pieces already checked are kept)";
          });
      }
      button.addEventListener("click", fetchIt);
      box.appendChild(row);
      // pictures up to 16 MB show at once
      if (kind.indexOf("image/") === 0 && f.size <= 16777216) fetchIt();
    });
    return count;
  }

  // ---- the replies: the sender's answers and the readers' notes ---------
  var shown = { body: null, files: null, talk: null }, timer = null;

  function when(seconds) {
    var d = new Date(seconds * 1000);
    return isNaN(d) ? "" : d.toLocaleString();
  }

  function showTalk() {
    var talk = message.talk || [], box = $("entries");
    var key = JSON.stringify(talk);
    if (key !== shown.talk) {
      shown.talk = key;
      box.textContent = "";
      talk.forEach(function (t) {
        var row = document.createElement("div");
        row.className = "said" + (t.who === "author" ? " author" : "");
        var who = document.createElement("div"); who.className = "note";
        who.textContent = (t.who === "author" ? "The sender" : (t.name || "A reader")) + ", " + when(t.time);
        var text = document.createElement("div"); text.className = "text"; text.textContent = t.body;
        row.appendChild(who); row.appendChild(text);
        if (t.who === "author") {
          var files = document.createElement("div");
          if (showFiles(files, t.part)) row.appendChild(files);
        }
        box.appendChild(row);
      });
      if (!talk.length) {
        var none = document.createElement("p"); none.className = "note";
        none.textContent = message.notes ? "No replies yet." : "No replies.";
        box.appendChild(none);
      }
    }
    $("say").hidden = !message.notes;
    $("talk").hidden = !(talk.length || message.notes);
  }

  function show() {
    if (message.body !== shown.body) { shown.body = message.body; $("body").textContent = message.body; }
    $("message").hidden = false;
    var files = JSON.stringify(message.files || []);
    if (files !== shown.files) {
      // a file list that changed is drawn again; one that did not keeps
      // what has already been fetched
      shown.files = files; shown.talk = null;
      $("files").hidden = !showFiles($("files"), 0);
    }
    showTalk();
  }

  function fetchMessage() {
    return fetchSealed("/m/" + link.address).then(function (sealed) {
      var plain = L.open(link.key, sealed);
      if (!plain) throw new Error("This message did not unlock.  The code may be mistyped, or the page was changed on the way.");
      return JSON.parse(new TextDecoder().decode(plain));
    });
  }

  // asked again each sync period while the page is open
  function poll() {
    clearTimeout(timer);
    var every = Math.max(10, Number(message.every) || 30) * 1000;
    timer = setTimeout(function () {
      fetchMessage().then(function (m) { message = m; show(); poll(); })
        .catch(function (e) {
          if (e.message === "gone") { status("The sender has taken this message down."); return; }
          poll();
        });
    }, every);
  }

  $("say").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var body = $("words").value, name = $("who").value.trim();
    if (!body.trim()) return;
    var nonce = new Uint8Array(12); crypto.getRandomValues(nonce);
    var sealed = L.sealNote(link.noteKey, nonce, name, body);
    var button = $("say").querySelector("button");
    button.disabled = true; $("sent").textContent = "Sending…";
    fetch(link.base + "/m/" + link.address + "/notes", { method: "POST", body: sealed,
        cache: "no-store", referrerPolicy: "no-referrer" })
      .then(function (r) {
        return r.text().then(function (t) {
          if (!r.ok) throw new Error(r.status === 404 ? "The sender has taken this message down." : t.trim() || ("the server answered " + r.status));
        });
      })
      .then(function () {
        $("words").value = ""; $("sent").textContent = "Sent.";
        return fetchMessage().then(function (m) { message = m; show(); poll(); });
      })
      .catch(function (e) { $("sent").textContent = "Not sent: " + e.message; })
      .then(function () { button.disabled = false; });
  });

  function unlock(text) {
    var input = L.readInput(text, here);
    if (!input.base) { status("Paste the whole link: this saved copy does not know which server to ask."); $("ask").hidden = false; return; }
    if (!L.normalize(input.words)) { $("ask").hidden = false; return; }
    var d = L.derive(input.words);
    link = { base: input.base, address: d.address, key: d.key, noteKey: d.noteKey };
    status("Unlocking…");
    fetchMessage().then(function (m) {
      message = m;
      $("ask").hidden = true; status("");
      return openDb().then(function (d) { db = d; show(); poll(); });
    }).catch(function (e) {
      $("ask").hidden = false;
      status(e.message === "gone" ? "Nothing is published under that code, or it has been taken down." : e.message);
    });
  }

  $("ask").addEventListener("submit", function (ev) { ev.preventDefault(); unlock($("code").value); });
  if (location.hash.length > 1) unlock(location.href); else $("ask").hidden = false;
})();
</script>
</body>
